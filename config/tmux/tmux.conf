# Geral {

# Prefix em C-a no lugar de C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g history-limit 10000
set -sg escape-time 0
set -g focus-events on
set -g allow-passthrough on

# Windows e panes começam em 1 e são renumeradas ao fechar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Impede programas de renomearem a window via escape sequence
set -g allow-rename off

# Sem alertas de bell
set -g bell-action none

# Truecolor no Ghostty (índice fixo para não duplicar a cada reload)
set -g default-terminal "tmux-256color"
set -s terminal-features[10] "xterm-ghostty:RGB"

# }
# Teclas {

bind r source-file ~/.tmux.conf \; display "Reloaded config"

# Splits com \ e -, abrindo no diretório atual
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind = select-layout even-vertical

# Navegação entre windows: Shift+setas troca, Ctrl+Shift+setas move
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n C-S-Left  swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# Navegação entre panes: Alt+setas sem prefix, ou prefix + h/j/k/l
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# }
# Copy mode {

setw -g mode-keys vi
bind -T copy-mode-vi K send-keys -X page-up
bind -T copy-mode-vi J send-keys -X page-down
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# }
# Aparência {

setw -g clock-mode-colour colour135
setw -g mode-style bg=colour238

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

set -g message-style bg=colour166
set -g message-command-style bg=black

# Statusbar: sem nada à esquerda, data e hora à direita
set -g status-interval 2
set -g status-style fg=colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Windows: a atual mostra os flags (*, Z...), as demais escondem o "-"
setw -g window-status-current-style bg=colour238
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#{?@claude_status, #{E:@claude_fmt},}#[fg=colour50]#F '
setw -g window-status-style bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#{?@claude_status, #{E:@claude_fmt},}#[fg=colour244]#{s/-//:window_flags} '
setw -g window-status-bell-style bg=colour1

# }
# Claude Code status {

# Bolinha com o status do Claude Code ao lado do nome da window. O valor de
# @claude_status é gravado pelo plugin tmux-status
# (https://github.com/guilhermehilst/claude-tmux-status).
set -g @claude_fmt '#{?#{==:#{@claude_status},working},#[fg=colour220]●,#{?#{==:#{@claude_status},waiting},#[fg=colour196]●,#{?#{==:#{@claude_status},done},#[fg=colour46]●,#{?#{==:#{@claude_status},idle},#[fg=colour39]●,#{?#{==:#{@claude_status},compacting},#[fg=colour135]●,}}}}}'

# "Pronto" funciona como não lido: some ao visitar a window
set-hook -g after-select-window 'if -F "#{==:#{@claude_status},done}" "set -w @claude_status idle"'
set-hook -g client-session-changed 'if -F "#{==:#{@claude_status},done}" "set -w @claude_status idle"'

# }
