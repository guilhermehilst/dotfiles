# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf \; display "Reloaded config"

# split panes using \ and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind = select-layout even-vertical

# set history limit to 10_000
set -g history-limit 10000

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# start windows number at 1
set -g base-index 1

# start pane number at 1
setw -g pane-base-index 1

# auto renumber windows
set -g renumber-windows on

set -g focus-events on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Crtl Shift Arrow to swap windows
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set tmux to Vi mode
#set-window-option -g mode-keys vi
setw -g mode-keys vi
# Scroll up/down with j/k

#bind-key -T vi-copy K page-up
#bind-key -T vi-copy  'J' page-down
bind-key -T copy-mode-vi 'K' send-keys -X page-up
bind-key -T copy-mode-vi 'J' send-keys -X page-down

bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
#bind-key -T copy-mode-vi 'y' send-keys -X; run-shell "tmux show-buffer | pbcopy"; display-message "copied"
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
#bind-key -T copy-mode-vi 'y'  send-keys -X copy-pipe "reattach-to-user-namespace pbcopy"
#bind-key -T copy-mode-vi 'v' begin-selection
#bind -T copy-mode-vi y copy-pipe "xclip -sel clip -i"
#bind-key -t vi-copy 'y' copy-selection

# No delay for escape key press
set -sg escape-time 0

######################
### DESIGN CHANGES ###
######################

## Status bar design
# status line
set -g status-justify left
set -g status-interval 2

# messaging
set -g message-command-style bg=black

# loud or quiet?
set -g allow-passthrough on
# set-option -g allow-passthrough on
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "screen-256color"

# The modes {
setw -g clock-mode-colour colour135
#setw -g mode-attr bold
setw -g mode-style bg=colour238

# }
# The panes {

#set -g pane-border-bg colour235
set -g pane-border-style fg=colour238
#set -g pane-active-border-bg colour236
set -g pane-active-border-style fg=colour51

# }
# The statusbar {

set -g status-position bottom
set -g status-style fg=colour137
#set -g status-attr dim
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style bg=colour238
#setw -g window-status-current-attr bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#{?@claude_status, #{E:@claude_fmt},}#[fg=colour50]#F '

setw -g window-status-style bg=colour235
#setw -g window-status-attr none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#{?@claude_status, #{E:@claude_fmt},}#[fg=colour244]#{s/-//:window_flags} '

#setw -g window-status-bell-attr bold
setw -g window-status-bell-style bg=colour1

# }
# Claude Code status {

# Bolinha com o status do Claude Code ao lado do nome da window. O valor de
# @claude_status é gravado pelo plugin tmux-status
# (https://github.com/guilhermehilst/claude-tmux-status).
set -g @claude_fmt '#{?#{==:#{@claude_status},working},#[fg=colour220]●,#{?#{==:#{@claude_status},waiting},#[fg=colour196]●,#{?#{==:#{@claude_status},done},#[fg=colour46]●,#{?#{==:#{@claude_status},idle},#[fg=colour39]●,#{?#{==:#{@claude_status},compacting},#[fg=colour135]●,}}}}}'

# "Pronto" funciona como não lido: some ao visitar a window
set-hook -g after-select-window 'if -F "#{==:#{@claude_status},done}" "set -w @claude_status idle"'
set-hook -g client-session-changed 'if -F "#{==:#{@claude_status},done}" "set -w @claude_status idle"'

# }
# The messages {

#set -g message-attr bold
set -g message-style bg=colour166

